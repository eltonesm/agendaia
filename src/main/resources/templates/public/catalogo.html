<!doctype html>
<!--/*
  Página pública de agendamento — passo 1: escolher o serviço
  (pagina-publica-agendamento, TODO-006, US-1).

  Sem sessão, sem navbar de admin: businessName vem de LayoutAdvice, que
  agora também lê o atributo que TenantContextFilter preenche ao resolver
  o tenant pelo slug (DD-3/DD-4 da spec técnica).
*/-->
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head th:replace="~{fragments/layout :: head(${businessName})}"></head>
<body>

<header class="bg-body-tertiary border-bottom py-3 mb-4">
  <div class="container">
    <span class="h5 mb-0" th:text="${businessName}">Estabelecimento</span>
  </div>
</header>

<main class="container" style="max-width: 40rem">

  <h1 class="h4 mb-3">O que você gostaria de agendar?</h1>

  <div class="alert alert-secondary" th:if="${#lists.isEmpty(servicos)}">
    Nenhum serviço disponível no momento.
  </div>

  <div class="list-group" th:unless="${#lists.isEmpty(servicos)}">
    <a th:each="servico : ${servicos}"
       th:href="@{/b/{slug}/servicos/{serviceId}(slug=${slug},serviceId=${servico.id()})}"
       class="list-group-item list-group-item-action"
       th:text="${servico.name()}">Serviço</a>
  </div>

</main>

<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
