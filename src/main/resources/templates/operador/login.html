<!doctype html>
<!--/*
  Entrada no painel do operador.

  Rota inteiramente separada de /login (BR-6, DD-3): credencial própria,
  nascida por configuração, nunca por formulário (BR-7) -- este formulário
  só existe para digitar a credencial que já existe, nunca para criar uma.
*/-->
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head th:replace="~{fragments/layout :: head('Operador')}"></head>
<body>

<div class="container d-flex justify-content-end pt-3">
  <button type="button" th:replace="~{fragments/layout :: temaToggle}"></button>
</div>

<main class="container py-5" style="max-width: 24rem">

  <h1 class="h3 mb-4">Painel do operador</h1>

  <div class="alert alert-danger" th:if="${param.erro}">
    Usuário ou senha incorretos.
  </div>

  <div class="alert alert-success" th:if="${param.saiu}">
    Você saiu da sua conta.
  </div>

  <form th:action="@{/operador/login}" method="post">
    <div class="mb-3">
      <label for="username" class="form-label">Usuário</label>
      <input type="text" id="username" name="username" class="form-control"
             autocomplete="username" required autofocus>
    </div>

    <div class="mb-4">
      <label for="password" class="form-label">Senha</label>
      <div class="input-group">
        <input type="password" id="password" name="password" class="form-control"
               autocomplete="current-password" required>
        <button type="button" class="btn btn-outline-secondary js-alternar-senha" data-alvo="password"
                aria-label="Mostrar senha"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M12 5c-5.5 0-9.6 3.4-11.4 6.6a1 1 0 0 0 0 .8C2.4 15.6 6.5 19 12 19s9.6-3.4 11.4-6.6a1 1 0 0 0 0-.8C21.6 8.4 17.5 5 12 5zm0 12c-2.8 0-5-2.2-5-5s2.2-5 5-5 5 2.2 5 5-2.2 5-5 5zm0-8a3 3 0 1 0 0 6 3 3 0 0 0 0-6z"></path></svg></button>
      </div>
    </div>

    <button type="submit" class="btn btn-primary w-100">Entrar</button>
  </form>

</main>

<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
