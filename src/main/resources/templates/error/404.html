<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head th:replace="~{fragments/layout :: head('Página não encontrada')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<!--/* Quem cai aqui sem sessão (link quebrado, ainda não logado) também
       merece o alternador de tema — a navbar acima só aparece autenticado. */-->
<div class="container d-flex justify-content-end pt-3"
     xmlns:sec="http://www.thymeleaf.org/extras/spring-security" sec:authorize="!isAuthenticated()">
  <button type="button" th:replace="~{fragments/layout :: temaToggle}"></button>
</div>

<main class="container" style="max-width: 32rem">
  <h1 class="h4">Página não encontrada</h1>
  <p class="text-body-secondary">
    O endereço que você abriu não existe. Se veio de um link compartilhado por um
    estabelecimento, confira se ele foi copiado por inteiro.
  </p>
  <a class="btn btn-primary" th:href="@{/}">Ir para o início</a>
</main>

<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
