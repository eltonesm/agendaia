<!doctype html>
<!--/*
  Esqueleto mínimo das telas.

  Deliberadamente pequeno: o PATTERNS.md diz que fragmento nasce na SEGUNDA
  repetição, não na primeira. Aqui existem só os três pedaços que toda página
  precisa — cabeça, barra e rodapé. O que mais se repetir aparece na TASK-011,
  quando houver telas suficientes para mostrar o que de fato é comum.

  Bootstrap 5.3.3 por CDN, com versão fixada e integrity (ADR 0012). Os hashes
  foram calculados a partir do arquivo real, não copiados.
*/-->
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">

<head th:fragment="head(titulo)">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title th:text="|${titulo} · AgendaIA|">AgendaIA</title>
  <!--/*
    Aplica o tema ANTES do CSS pintar, para não piscar claro e depois escuro.
    localStorage é por navegador — cada visitante escolhe o próprio, sem
    precisar de conta nem de campo novo em Business (ver nota da TASK de tema
    claro/escuro em sdd/backlog.md: escolha do estabelecimento para /b/{slug}
    fica para TODO-006/007, ADR 0012).
  */-->
  <script>
    (function () {
      var salvo = localStorage.getItem('agendaia-theme');
      var tema = salvo || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      document.documentElement.setAttribute('data-bs-theme', tema);
    })();
  </script>
  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
        crossorigin="anonymous">
  <!--/*
    Camada de tema do admin — indigo em vez do azul padrão do Bootstrap, e
    cantos/sombra mais suaves. Sobrescreve custom properties --bs-*, sem SASS
    e sem build (mesma técnica do ADR 0012, aplicada aqui numa escala menor:
    só cor e raio, não a reconstrução visual completa da página pública).
    Cobre só as classes realmente usadas nas telas atuais — ver PATTERNS.md,
    "nunca escreva CSS especulativo".

    Amendment ao ADR 0012 (2026-09-01): "o admin usa Bootstrap como vem"
    ganhou esta exceção pontual, motivada por um protótipo de referência
    aprovado pelo dono. Sidebar de navegação e cards de KPI do protótipo
    ficam para quando `scheduling` existir (IDEA-009) — sem dado real por
    trás, esses componentes ficariam bonitos e vazios.
  */-->
  <style>
    :root {
      --bs-border-radius: 0.75rem;
      --bs-border-radius-sm: 0.5rem;
      --bs-border-radius-lg: 1rem;
      --bs-primary: #4f46e5;
      --bs-primary-rgb: 79, 70, 229;
      --bs-link-color: #4f46e5;
      --bs-link-color-rgb: 79, 70, 229;
      --bs-link-hover-color: #4338ca;
      --bs-link-hover-color-rgb: 67, 56, 202;
    }

    .btn-primary {
      --bs-btn-bg: #4f46e5;
      --bs-btn-border-color: #4f46e5;
      --bs-btn-hover-bg: #4338ca;
      --bs-btn-hover-border-color: #4338ca;
      --bs-btn-active-bg: #4338ca;
      --bs-btn-active-border-color: #3730a3;
      --bs-btn-disabled-bg: #4f46e5;
      --bs-btn-disabled-border-color: #4f46e5;
    }

    .list-group {
      box-shadow: 0 1px 3px rgba(0, 0, 0, .06);
    }
  </style>
</head>

<body>

<!--/* Barra do painel. Só aparece para quem está autenticado. */-->
<nav th:fragment="navbar" class="navbar navbar-expand-lg bg-body-tertiary border-bottom mb-4"
     sec:authorize="isAuthenticated()"
     xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
  <div class="container">
    <a class="navbar-brand fw-semibold" th:href="@{/admin/dashboard}">AgendaIA</a>
    <div class="d-flex align-items-center gap-3">
      <!--/*
        Lê do model, não do principal. Navegar por principal.businessName
        estouraria em toda página quando o principal fosse de outro tipo —
        e erro no layout derruba todas as telas de uma vez. Quem resolve isso
        é o LayoutAdvice.
      */-->
      <span class="text-body-secondary small" th:text="${businessName}">Estabelecimento</span>
      <button type="button" id="alternar-tema" class="btn btn-sm btn-outline-secondary"
              aria-label="Alternar tema claro/escuro">🌙</button>
      <!--/* Logout é POST por causa do CSRF: link GET seria vulnerável a
             logout forçado por terceiro. */-->
      <form th:action="@{/logout}" method="post" class="m-0">
        <button type="submit" class="btn btn-sm btn-outline-secondary">Sair</button>
      </form>
    </div>
  </div>
</nav>

<footer th:fragment="scripts">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
          integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
          crossorigin="anonymous"></script>
  <!--/* Botão só existe em página autenticada (navbar tem sec:authorize) —
         sem elemento, sem listener, sem erro. */-->
  <script>
    (function () {
      var botao = document.getElementById('alternar-tema');
      if (!botao) return;

      function atualizarIcone() {
        var atual = document.documentElement.getAttribute('data-bs-theme');
        botao.textContent = atual === 'dark' ? '☀️' : '🌙';
      }

      botao.addEventListener('click', function () {
        var atual = document.documentElement.getAttribute('data-bs-theme');
        var novo = atual === 'dark' ? 'light' : 'dark';
        document.documentElement.setAttribute('data-bs-theme', novo);
        localStorage.setItem('agendaia-theme', novo);
        atualizarIcone();
      });

      atualizarIcone();
    })();
  </script>
</footer>

</body>
</html>
