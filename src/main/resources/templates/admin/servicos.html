<!doctype html>
<!--/*
  Cadastro e lista de serviços, numa tela só (DD-4).

  Descrição é opcional. Preço e duração não aparecem aqui — isso é da
  oferta (/admin/ofertas), não do serviço (glossário, seção 3).
*/-->
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head th:replace="~{fragments/layout :: head('Serviços')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<main class="container" style="max-width: 30rem">

  <h1 class="h4 mb-1">Serviços</h1>
  <p class="text-body-secondary mb-4">
    O que o seu estabelecimento oferece. Preço e duração ficam por conta de
    cada profissional em <a th:href="@{/admin/ofertas}">Ofertas</a>.
  </p>

  <form th:action="@{/admin/servicos}" th:object="${form}" method="post" novalidate class="mb-4">

    <div class="alert alert-danger" th:if="${#fields.hasGlobalErrors()}">
      <div th:each="erro : ${#fields.globalErrors()}" th:text="${erro}">erro</div>
    </div>

    <div class="mb-2">
      <label for="name" class="form-label">Nome do serviço</label>
      <input type="text" id="name" th:field="*{name}"
             class="form-control" th:classappend="${#fields.hasErrors('name')} ? 'is-invalid'"
             placeholder="Corte de Cabelo" autocomplete="off" autofocus>
      <div class="invalid-feedback" th:if="${#fields.hasErrors('name')}" th:errors="*{name}">erro</div>
    </div>

    <div class="mb-2">
      <label for="description" class="form-label">Descrição (opcional)</label>
      <textarea id="description" th:field="*{description}" rows="2"
                class="form-control" th:classappend="${#fields.hasErrors('description')} ? 'is-invalid'"
                placeholder="Corte na tesoura ou máquina"></textarea>
      <div class="invalid-feedback" th:if="${#fields.hasErrors('description')}" th:errors="*{description}">erro</div>
    </div>

    <button type="submit" class="btn btn-primary">Cadastrar</button>
  </form>

  <ul class="list-group" th:if="${not #lists.isEmpty(servicos)}">
    <li class="list-group-item" th:each="servico : ${servicos}" th:text="${servico.name}">Nome do serviço</li>
  </ul>

  <div class="alert alert-secondary" role="status" th:if="${#lists.isEmpty(servicos)}">
    Nenhum serviço cadastrado ainda. Cadastre o primeiro acima.
  </div>

</main>

<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
