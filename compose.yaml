# Dependências de desenvolvimento local.
#
# Sobe apenas o banco. A aplicação roda pela IDE ou por ./mvnw spring-boot:run,
# que é o que dá hot reload de template e recompilação rápida — colocar a app
# num container aqui só serviria para tornar o ciclo de desenvolvimento pior.
#
# O compose de produção (app + banco + proxy com TLS) é outro arquivo e nasce
# junto com o deploy na VPS.
#
#   docker compose up -d
#   docker compose logs -f postgres
#   docker compose down          (mantém os dados)
#   docker compose down -v       (apaga o volume — recomeça do zero)

name: agendaia

services:
  postgres:
    image: postgres:18-alpine
    container_name: agendaia-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-agendaia}
      POSTGRES_USER: ${POSTGRES_USER:-agendaia}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-agendaia}
      # Collation ICU pt-BR para que ordenação e comparação de texto se
      # comportem como em produção desde o desenvolvimento. A imagem é Alpine
      # (musl), que não tem o locale pt_BR do sistema — daí o LC_* em C.UTF-8 e
      # a ordenação vindo do ICU, que não depende do locale do sistema.
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C.UTF-8 --locale-provider=icu --icu-locale=pt-BR"
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      # Postgres 18+ mudou o ponto de montagem: a imagem espera o volume em
      # /var/lib/postgresql e cria a subpasta por versão dentro dele, para que
      # "pg_upgrade --link" funcione sem cruzar fronteira de mount. Montar em
      # /var/lib/postgresql/data — como era o padrão até a 17 — faz o container
      # entrar em crash loop.
      - postgres-data:/var/lib/postgresql
    healthcheck:
      # A app e os testes esperam por este healthcheck antes de conectar.
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-agendaia} -d ${POSTGRES_DB:-agendaia}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  postgres-data:
    name: agendaia-postgres-data
